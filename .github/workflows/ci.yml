name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install "ruff>=0.8"
      - name: ruff check
        run: ruff check .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions in pyproject's classifiers. The suite is offline and
        # finishes in about a second, so the whole matrix is cheap.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Test suite (offline, no browser)
        # The engines are optional at runtime and absent on a clean runner;
        # every module must still import and every degrade path must hold.
        run: python tests/run_tests.py

  test-macos:
    name: test (macOS, py3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Test suite (offline, no browser)
        run: python tests/run_tests.py

  test-windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Test suite (offline, no browser)
        # Windows is a supported OS in pyproject and gets its own fallbacks
        # (no dig/whois, reserved filenames) — it must be exercised, not
        # documented. The suite is offline and hermetic, so this only costs
        # a runner minute.
        run: python tests/run_tests.py

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Type errors in the vendored engines and the merge layer are real
      # bugs waiting for an upstream sync; mypy was a dev extra nobody
      # ran, so it lives here now (config in pyproject.toml).
      - run: mypy spyglass_pro

  package:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip build
      - run: python -m build
      - name: License and vendored engines must ship in the wheel
        # A wheel missing LICENSE/NOTICE or spyglass_pro/modules/ installs
        # successfully and then fails at runtime — assert the contents.
        # `grep -q` exits on first match, which SIGPIPEs `unzip` and trips
        # `pipefail`, so the listing is captured once and grepped as a file.
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          unzip -l "$whl" > wheel-listing.txt
          unzip -p "$whl" "*/METADATA" > wheel-metadata.txt
          grep -q "licenses/LICENSE" wheel-listing.txt
          grep -q "licenses/NOTICE" wheel-listing.txt
          grep -q "^License-Expression: MIT" wheel-metadata.txt
          for pkg in spyglass_osint instacloak lens_extender; do
            grep -q "spyglass_pro/modules/$pkg/__init__.py" wheel-listing.txt \
              || { echo "MISSING vendored package: $pkg"; exit 1; }
          done
          echo "wheel carries LICENSE, NOTICE, MIT metadata and all three vendored engines"
      - name: The sdist must not carry local working drafts
        # MANIFEST.in does not read .gitignore: a draft that is ignored in git
        # can still be copied into the sdist by `python -m build`.
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz)
          if tar tzf "$sdist" | grep -q "docs/PLAN-"; then
            echo "FAIL: the sdist carries a local working draft:"
            tar tzf "$sdist" | grep "docs/PLAN-"
            exit 1
          fi
          echo "sdist carries no working drafts"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/