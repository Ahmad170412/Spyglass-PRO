[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spyglass-pro"
version = "1.0.0"
description = "Spyglass-Pro — unified OSINT superpower wiring Spyglass-OSINT, InstaCloak, and Lens-Extender into one platform"
readme = "README.md"
# PEP 639: a single SPDX expression plus explicit license files, in place of
# the deprecated `license = {file = ...}` table and the license classifier.
# One holder covers the whole tree, modules/ included — see NOTICE.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "TeamLeader", email = "teamleadertrue@gmail.com" }]
keywords = ["osint", "recon", "unified", "instagram", "ip", "investigation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "flask>=3.0",
  "rich>=13.0",
  "cryptography>=42.0.0",
  "httpx>=0.27",
  "phonenumbers>=8.13",
  "waitress>=2.0",
]

[project.urls]
Homepage = "https://github.com/Ahmad170412/Spyglass-PRO"
Source = "https://github.com/Ahmad170412/Spyglass-PRO"
Issues = "https://github.com/Ahmad170412/Spyglass-PRO/issues"

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.10", "build>=1.2"]

[project.scripts]
spyglass-pro = "spyglass_pro.cli:main"

[tool.setuptools.packages.find]
include = ["spyglass_pro*"]

[tool.setuptools.package-data]
spyglass_pro = ["templates/*.html", "static/favicon.svg", "static/css/*.css", "static/js/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "BLE", "SIM", "PIE", "RUF", "DTZ", "PLW"]
ignore = [
    "BLE001", "RUF012", "S110", "PLW1510", "S311", "S603", "S314", "S104",
    "DTZ005", "PLW0603", "SIM105", "SIM112", "B904", "PLW2901", "PIE810",
]

[tool.ruff.lint.per-file-ignores]
# The inherited engine suites use bare asserts and literal credentials as
# fixtures; that is their upstream style, not a finding.
"tests/*" = ["S101", "S105", "S106", "S301", "S603", "S607", "SIM117", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true